spring.application.name=skier-consumer

# ---------------------------------------------------------------------------
# Environment-driven with local-first defaults; contains no secrets. AWS
# credentials come from the SDK default provider chain, never from here.
# ---------------------------------------------------------------------------

server.port=${SERVER_PORT:8085}

# --- RabbitMQ ---------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.cache.channel.size=${RABBITMQ_CHANNEL_CACHE:300}
spring.rabbitmq.cache.channel.checkout-timeout=1000

# The consumer publishes one thing: a retriable delivery, onto the delay queue.
# The original may only be acknowledged once that copy is confirmed, so correlated
# confirms are load-bearing rather than observability. publisher-returns catches
# the case where the retry binding is missing, which would otherwise ack the
# original against a copy the broker dropped.
spring.rabbitmq.publisher-confirm-type=${RABBITMQ_CONFIRM_TYPE:correlated}
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Consumer concurrency. Prefetch is per-consumer, so the broker may have
# concurrency x prefetch messages outstanding; that product is what sizes the
# consumer's heap, not prefetch alone.
skier.consumer.concurrency=${CONSUMER_CONCURRENCY:32}
skier.consumer.max-concurrency=${CONSUMER_MAX_CONCURRENCY:64}
skier.consumer.prefetch=${CONSUMER_PREFETCH:250}

# --- AWS --------------------------------------------------------------------
aws.region=${AWS_REGION:us-west-2}
aws.dynamodb.endpoint=${AWS_DYNAMODB_ENDPOINT:}

# --- Write path -------------------------------------------------------------
# single = one PutItem per event (original behaviour, kept for A/B benchmarking)
# batch  = coalesce into BatchWriteItem of up to 25 items
skier.writer.mode=${WRITER_MODE:batch}
skier.writer.batch-size=${WRITER_BATCH_SIZE:25}
skier.writer.linger-ms=${WRITER_LINGER_MS:20}
skier.writer.threads=${WRITER_THREADS:16}
skier.writer.queue-capacity=${WRITER_QUEUE_CAPACITY:50000}
# Attempts one event may cost, enforced against the x-attempts header rather than a
# field on the in-flight object, the count has to outlive this process or the broker's
# own redelivery resets it.
skier.writer.max-retries=${WRITER_MAX_RETRIES:5}
# How long a retriable failure waits in liftRideRetryQueue before redelivery, as that
# queue's x-message-ttl. Adds directly to the failed event's freshness: five attempts
# at 500ms is 2.5s against objective 5's 30s target.
skier.writer.retry-delay-ms=${WRITER_RETRY_DELAY_MS:500}
skier.writer.retry-confirm-timeout-ms=${WRITER_RETRY_CONFIRM_TIMEOUT_MS:2000}

# --- Unique-skier cardinality ----------------------------------------------
# dynamodb  = conditional-write sentinel per (resort,season,day,skier); exact,
#             costs one extra write per first sighting.
# redis-hll = HyperLogLog per (resort,season,day); ~0.81% relative error at
#             12 KiB per key regardless of cardinality.
skier.cardinality.strategy=${CARDINALITY_STRATEGY:dynamodb}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}

# --- Observability ----------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.skier.write.latency=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.01}
