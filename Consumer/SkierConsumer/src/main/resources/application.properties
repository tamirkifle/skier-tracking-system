spring.application.name=skier-consumer

# ---------------------------------------------------------------------------
# Environment-driven with local-first defaults; contains no secrets. AWS
# credentials come from the SDK default provider chain, never from here.
# ---------------------------------------------------------------------------

server.port=${SERVER_PORT:8085}

# --- AWS --------------------------------------------------------------------
aws.region=${AWS_REGION:us-west-2}
aws.dynamodb.endpoint=${AWS_DYNAMODB_ENDPOINT:}

# --- Observability ----------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.01}
