spring.application.name=skier-consumer

# ---------------------------------------------------------------------------
# Environment-driven with local-first defaults; contains no secrets. AWS
# credentials come from the SDK default provider chain, never from here.
# ---------------------------------------------------------------------------

server.port=${SERVER_PORT:8085}

# --- AWS --------------------------------------------------------------------
aws.region=${AWS_REGION:us-west-2}
aws.dynamodb.endpoint=${AWS_DYNAMODB_ENDPOINT:}

# --- Write path -------------------------------------------------------------
# single = one PutItem per event (original behaviour, kept for A/B benchmarking)
# batch  = coalesce into BatchWriteItem of up to 25 items
skier.writer.mode=${WRITER_MODE:batch}
skier.writer.batch-size=${WRITER_BATCH_SIZE:25}
skier.writer.linger-ms=${WRITER_LINGER_MS:20}
skier.writer.threads=${WRITER_THREADS:16}
skier.writer.queue-capacity=${WRITER_QUEUE_CAPACITY:50000}

# --- Unique-skier cardinality ----------------------------------------------
# dynamodb  = conditional-write sentinel per (resort,season,day,skier); exact,
#             costs one extra write per first sighting.
# redis-hll = HyperLogLog per (resort,season,day); ~0.81% relative error at
#             12 KiB per key regardless of cardinality.
skier.cardinality.strategy=${CARDINALITY_STRATEGY:dynamodb}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}

# --- Observability ----------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.01}
