spring.application.name=skier-server

# ---------------------------------------------------------------------------
# Everything here is environment-driven with a local-first default, so the
# checked-in file is safe to read, safe to publish, and needs no edits to run
# against `docker compose up`. No value below is a secret.
#
# AWS credentials are deliberately absent: both DynamoDB clients use the SDK
# default provider chain (env vars -> profile -> container -> instance role).
# ---------------------------------------------------------------------------

server.port=${SERVER_PORT:8080}

# Tomcat sizing. The ingest path is a short publish-and-return, so threads are
# cheap; the ceiling exists to bound memory rather than to throttle.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:400}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:500}
server.tomcat.connection-timeout=5s

# --- RabbitMQ ---------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.cache.channel.size=${RABBITMQ_CHANNEL_CACHE:300}
spring.rabbitmq.requested-heartbeat=60s

# Publisher confirms let the ingest path distinguish "the broker owns this
# event" from "the socket accepted these bytes". Without them a 200 OK is a
# lie whenever the broker drops the message after the write returns.
spring.rabbitmq.publisher-confirm-type=${RABBITMQ_CONFIRM_TYPE:correlated}
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=200ms
spring.rabbitmq.template.retry.multiplier=2
spring.rabbitmq.template.retry.max-attempts=4

# --- AWS --------------------------------------------------------------------
aws.region=${AWS_REGION:us-west-2}
# Set to e.g. http://localhost:4566 to target LocalStack. Empty = real AWS.
aws.dynamodb.endpoint=${AWS_DYNAMODB_ENDPOINT:}

# --- Redis / caching --------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}
spring.cache.type=${CACHE_TYPE:redis}
skier.cache.ttl=${CACHE_TTL:PT1H}

# --- Admission control ------------------------------------------------------
# Token-bucket capacity in permits/second, steered at runtime by the queue-depth
# controller.
skier.admission.initial-capacity=${ADMISSION_INITIAL_CAPACITY:1700}
skier.admission.refill-interval-ms=${ADMISSION_REFILL_INTERVAL_MS:10}
# The hardest the controller may shed. Configuration rather than a constant because
# it is only meaningful against what the pipeline downstream can drain, which is a
# property of the deployment: set above that, admission control cannot stabilise the
# queue at all, and the server reports it via skier_admission_floor_pinned_total.
skier.admission.min-rate=${ADMISSION_MIN_RATE:100}
# Upper bound on how long a request may block waiting for a permit before the
# server sheds it with 429.
skier.admission.max-wait-ms=${ADMISSION_MAX_WAIT_MS:250}
skier.admission.wait-slice-ms=${ADMISSION_WAIT_SLICE_MS:5}

# --- Multi-replica admission coordination -----------------------------------
# The admission floor and the controller's two additive steps are fleet-wide
# quantities applied by every instance, so N replicas cost N times each of them.
# Each instance divides them by the number of instances heartbeating into the
# Redis sorted set below. The halving branch is deliberately NOT divided: it is
# already correct in aggregate, and dividing it too is a 1/2^N collapse.
# Dividing by one is the identity, so this changes nothing for a single server.
skier.fleet.coordination-enabled=${FLEET_COORDINATION_ENABLED:true}
skier.fleet.key=${FLEET_KEY:skier:admission:fleet}
skier.fleet.heartbeat-interval-ms=${FLEET_HEARTBEAT_INTERVAL_MS:2000}
# Five heartbeats. Too long over-counts a shrunk fleet and admits less than
# configured; too short evicts live instances and silently restores N times the
# admission. Refused at startup below three.
skier.fleet.member-ttl-ms=${FLEET_MEMBER_TTL_MS:10000}
# A decrease in the observed size is only applied after this many consecutive
# heartbeats report the same smaller size; growth applies on the first sighting.
# Asymmetric so a Redis restart's one-heartbeat undercount self-heals before it
# is ever applied, while a genuine scale-down is still recognised, just delayed.
skier.fleet.shrink-confirmations=${FLEET_SHRINK_CONFIRMATIONS:3}

# --- Queue-depth controller -------------------------------------------------
skier.queue-monitor.enabled=${QUEUE_MONITOR_ENABLED:true}
skier.queue-monitor.interval-ms=${QUEUE_MONITOR_INTERVAL_MS:200}
# depth (message counts, what the setpoints were tuned on) or latency (depth divided
# by the observed drain rate, so the target means the same thing at any consumer
# throughput). The latency thresholds below are the depth thresholds 100/150/200
# divided by an estimated drain rate of 80 events/s. Depth stays the default
# because the drain-rate signal's measured noise is wider than the deadband;
# the estimate is exported in both modes regardless.
skier.queue-monitor.setpoint-mode=${QUEUE_MONITOR_SETPOINT_MODE:depth}
skier.queue-monitor.target-latency=${QUEUE_MONITOR_TARGET_LATENCY:1875ms}
skier.queue-monitor.max-latency=${QUEUE_MONITOR_MAX_LATENCY:2500ms}
skier.queue-monitor.min-latency=${QUEUE_MONITOR_MIN_LATENCY:1250ms}
skier.queue-monitor.drain-rate-window=${QUEUE_MONITOR_DRAIN_RATE_WINDOW:10s}

# --- Resilience -------------------------------------------------------------
resilience4j.circuitbreaker.instances.dynamodb.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.dynamodb.sliding-window-size=50
resilience4j.circuitbreaker.instances.dynamodb.minimum-number-of-calls=20
resilience4j.circuitbreaker.instances.dynamodb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.dynamodb.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.dynamodb.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.dynamodb.register-health-indicator=true

# --- Observability ----------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
# readinessState is the default membership; fleetRegistry is added because an instance that has
# never observed the fleet size cannot take its share of the admission floor and takes the whole
# thing instead. Deliberately NOT `redis`: a Redis outage must not un-ready every
# replica at once, only the ones that have never been in service. See FleetRegistryHealthIndicator.
management.endpoint.health.group.readiness.include=readinessState,fleetRegistry
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=25ms,50ms,100ms,250ms,500ms,1s
management.observations.annotations.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.01}

# --- API docs ---------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
