# The whole system, locally, from nothing: `make up`.
#
# Everything below is real infrastructure rather than a stub. RabbitMQ is RabbitMQ, Redis is Redis,
# and DynamoDB is DynamoDB's own API surface via LocalStack. The schema is applied by the same tool
# a deployment would run, so a local stack and a real one cannot disagree about the tables.

name: skiers

services:
  # --- Infrastructure -----------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: skiers-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI: guest/guest
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      # `check_running` alone reports healthy before the node accepts connections.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [skiers]

  redis:
    image: redis:7.4-alpine
    container_name: skiers-redis
    ports:
      - "6379:6379"
    # A cache with no memory bound is a slow OOM. allkeys-lru is correct here because every key
    # is a recomputable read-path entry, so eviction costs a DynamoDB query and nothing more.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [skiers]

  localstack:
    image: localstack/localstack:3.8
    container_name: skiers-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb
      DEBUG: "0"
    volumes:
      # State is intentionally ephemeral: `PERSISTENCE` is a LocalStack Pro feature, so the community
      # image would silently ignore it. Table data is recreated by the schema service on every `up`,
      # which is the property that makes a local run reproducible anyway.
      - localstack-data:/var/lib/localstack
    healthcheck:
      # LocalStack reports a service as "available" until it is first used and "running" afterwards,
      # so matching only "available" makes the container flip to unhealthy the moment the system
      # actually works, and then every `docker compose up` after the first one fails on a healthy
      # dependency. Both states mean usable.
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -Eq '\"dynamodb\": \"(available|running)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [skiers]

  # --- Schema ------------------------------------------------------------------------------
  # Runs to completion, then exits. The services wait on its success rather than racing it.
  schema:
    build:
      context: .
      dockerfile: Infra/SchemaTool/Dockerfile
    container_name: skiers-schema
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_REGION: us-west-2
      AWS_DYNAMODB_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    restart: "no"
    networks: [skiers]

  # --- Services ----------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: Server/SkierServer/Dockerfile
    container_name: skiers-server
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema:
        condition: service_completed_successfully
    environment:
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      AWS_REGION: us-west-2
      AWS_DYNAMODB_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Substituted from the host environment with a default for local runs:
      #   ADMISSION_INITIAL_CAPACITY=8000 docker compose up -d --force-recreate server
      ADMISSION_INITIAL_CAPACITY: "${ADMISSION_INITIAL_CAPACITY:-2000}"
      ADMISSION_MAX_WAIT_MS: "${ADMISSION_MAX_WAIT_MS:-250}"
      # The floor on shedding is fleet-wide; with `--scale server=N` each replica takes 1/N.
      ADMISSION_MIN_RATE: "${ADMISSION_MIN_RATE:-100}"
      FLEET_COORDINATION_ENABLED: "${FLEET_COORDINATION_ENABLED:-true}"
      FLEET_HEARTBEAT_INTERVAL_MS: "${FLEET_HEARTBEAT_INTERVAL_MS:-2000}"
      FLEET_MEMBER_TTL_MS: "${FLEET_MEMBER_TTL_MS:-10000}"
      FLEET_SHRINK_CONFIRMATIONS: "${FLEET_SHRINK_CONFIRMATIONS:-3}"
      QUEUE_MONITOR_ENABLED: "${QUEUE_MONITOR_ENABLED:-true}"
      QUEUE_MONITOR_INTERVAL_MS: "${QUEUE_MONITOR_INTERVAL_MS:-200}"
      QUEUE_MONITOR_SETPOINT_MODE: "${QUEUE_MONITOR_SETPOINT_MODE:-depth}"
      QUEUE_MONITOR_TARGET_LATENCY: "${QUEUE_MONITOR_TARGET_LATENCY:-1875ms}"
      QUEUE_MONITOR_MAX_LATENCY: "${QUEUE_MONITOR_MAX_LATENCY:-2500ms}"
      QUEUE_MONITOR_MIN_LATENCY: "${QUEUE_MONITOR_MIN_LATENCY:-1250ms}"
      QUEUE_MONITOR_DRAIN_RATE_WINDOW: "${QUEUE_MONITOR_DRAIN_RATE_WINDOW:-10s}"
      TOMCAT_MAX_THREADS: "${TOMCAT_MAX_THREADS:-400}"
      TRACING_SAMPLE_RATE: "${TRACING_SAMPLE_RATE:-1.0}"
    networks: [skiers]

  consumer:
    build:
      context: .
      dockerfile: Consumer/SkierConsumer/Dockerfile
    container_name: skiers-consumer
    ports:
      - "8085:8085"
    depends_on:
      rabbitmq:
        condition: service_healthy
      schema:
        condition: service_completed_successfully
    environment:
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      AWS_REGION: us-west-2
      AWS_DYNAMODB_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CONSUMER_CONCURRENCY: "${CONSUMER_CONCURRENCY:-16}"
      CONSUMER_PREFETCH: "${CONSUMER_PREFETCH:-200}"
      WRITER_MODE: "${WRITER_MODE:-batch}"
      WRITER_BATCH_SIZE: "${WRITER_BATCH_SIZE:-25}"
      WRITER_LINGER_MS: "${WRITER_LINGER_MS:-20}"
      WRITER_THREADS: "${WRITER_THREADS:-8}"
      CARDINALITY_STRATEGY: "${CARDINALITY_STRATEGY:-dynamodb}"
      TRACING_SAMPLE_RATE: "${TRACING_SAMPLE_RATE:-1.0}"
    networks: [skiers]

networks:
  skiers:
    driver: bridge

volumes:
  localstack-data:
